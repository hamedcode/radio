<html lang="fa">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>رادیو آنلاین</title>
<meta name="description" content="پخش زنده ایستگاه‌های رادیویی فارسی، ترکی و آذری">

<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#121319;
  --bg-grain:#0e0f14;
  --card:#1c1e26;
  --card-hi:rgba(255,255,255,0.04);
  --accent:#f2a33d;
  --accent-soft:rgba(242,163,61,0.16);
  --accent-dark:#c97e1c;
  --accent-darker:#8a5c11;
  --text:#f3efe4;
  --muted-text:#96938a;
  --header:#16171d;
  --line:rgba(255,255,255,0.07);
  --station-border: 1px solid rgba(255,255,255,0.02);
  --danger:#e2543a;
}

:root[data-theme="light"]{
  --bg:#e3d6b8;
  --bg-grain:#d8c8a2;
  --card:#eee3c8;
  --card-hi:rgba(0,0,0,0.025);
  --text:#2a2317;
  --muted-text:#766d57;
  --header:#ebdfc0;
  --line:rgba(0,0,0,0.11);
  --station-border: 1px solid rgba(0,0,0,0.09);
}

*{box-sizing:border-box}
html{scrollbar-color: var(--accent) transparent;}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:8px;opacity:.6}
::-webkit-scrollbar-track{background:transparent}

body{
  margin:0;
  font-family:'Vazirmatn',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  direction:rtl;
  background:
    radial-gradient(1100px 500px at 15% -10%, var(--accent-soft), transparent 60%),
    var(--bg);
  color:var(--text);
  transition:background-color .35s ease, color .35s ease;
}

a{color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
}

/* ===== TOP BAR ===== */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:14px 20px;
  background:var(--header);
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:1500;
  backdrop-filter:blur(6px);
}

.brand{display:flex;align-items:center;gap:12px;min-width:0}

.brand-mark{
  width:42px;height:42px;
  flex:none;
  position:relative;
}
.brand-mark svg{width:100%;height:100%;overflow:visible}
.brand-mark .needle{
  transform-origin:16px 6px;
  animation:sweep-in 1.6s cubic-bezier(.2,.9,.25,1) 1;
}
@keyframes sweep-in{
  0%{transform:rotate(-46deg)}
  55%{transform:rotate(18deg)}
  100%{transform:rotate(0deg)}
}

.brand-text{min-width:0}
.title{font-size:19px;font-weight:800;letter-spacing:.2px;line-height:1.25}
.tagline{font-size:12.5px;color:var(--muted-text);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.topbar-controls{display:flex;align-items:center;gap:16px;flex:none}

.install-btn{
  display:flex;align-items:center;gap:6px;
  font-family:inherit;
  font-size:12.5px;
  font-weight:700;
  color:#1a1204;
  background:linear-gradient(180deg, var(--accent), var(--accent-dark));
  border:none;
  border-radius:50px;
  padding:8px 14px;
  cursor:pointer;
  box-shadow:0 3px 10px var(--accent-soft);
  transition:transform .12s ease;
}
.install-btn svg{width:15px;height:15px}
.install-btn:active{transform:scale(.96)}
.install-btn[hidden]{display:none}
@media(max-width:640px){
  .install-btn span{display:none}
}

/* theme switch, restyled as a tuner rocker */
.switch {
  width:54px; height:28px;
  border-radius:50px;
  background:var(--card);
  border:1px solid var(--line);
  position:relative;
  cursor:pointer;
  transition:background-color .25s ease, border-color .25s;
  display:flex;
  align-items:center;
  padding:0 5px;
  box-shadow: inset 0 2px 4px rgba(0,0,0,.35);
}
.switch-icon {
  font-size:13px;
  pointer-events:none;
  transition:.25s;
  position:absolute;
  left:7px;
  filter:grayscale(.2);
}
.switch.on .switch-icon { left:auto; right:7px; }
.switch-circle{
  width:20px;height:20px;
  border-radius:50%;
  background:linear-gradient(180deg,#fff,#d8d8d8);
  box-shadow:0 1px 3px rgba(0,0,0,.5), 0 0 0 3px rgba(0,0,0,.06) inset;
  transition:transform .25s cubic-bezier(.4,1.4,.6,1);
  position:relative;
  z-index:1;
}
.switch.on .switch-circle{transform:translateX(-26px); background:linear-gradient(180deg,var(--accent),var(--accent-dark))}

/* color picker -> mini tuning knobs */
.color-picker{display:flex;gap:9px;padding:5px 8px;background:var(--card);border:1px solid var(--line);border-radius:50px;box-shadow:inset 0 2px 4px rgba(0,0,0,.3)}
.color-swatch{
  width:18px;height:18px;
  border-radius:50%;
  cursor:pointer;
  border:2px solid rgba(255,255,255,0.12);
  transition:transform .18s ease, box-shadow .18s ease;
}
.color-swatch:hover{transform:scale(1.12)}
.color-swatch.selected{
  box-shadow:0 0 0 2px var(--header), 0 0 0 4px currentColor;
  transform:scale(1.1);
}

/* ===== CHANNEL LIST ===== */
.cols{
  display:flex;
  gap:20px;
  padding:20px;
  max-width:1100px;
  margin:14px auto 190px auto;
}
.col{flex:1;min-width:0}

.category{
  display:flex;
  align-items:baseline;
  gap:8px;
  padding:2px 4px 12px 4px;
  margin-bottom:10px;
  font-size:16px;
  font-weight:700;
  border-bottom:1px solid var(--line);
}
.category .count{font-size:12px;font-weight:500;color:var(--muted-text)}

/* station list */
.station-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.station{
  --glow:0;
  background:
    linear-gradient(180deg, var(--card-hi), transparent 40%),
    var(--card);
  border-radius:10px;
  padding:9px 12px 9px 9px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
  gap:10px;
  border:var(--station-border, 0);
  border-inline-start:3px solid transparent;
  box-shadow:0 1px 0 var(--card-hi) inset, 0 8px 18px -14px rgba(0,0,0,.6);
  transition:transform .15s ease, border-color .2s ease, box-shadow .2s ease, background-color .2s ease;
  position:relative;
}
.station:hover{transform:translateY(-2px)}
.station.playing{
  border-inline-start-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent-soft), 0 10px 22px -14px rgba(0,0,0,.7);
  animation:onair-pulse 2.6s ease-in-out infinite;
}
@keyframes onair-pulse{
  0%,100%{box-shadow:0 0 0 1px var(--accent-soft), 0 10px 22px -14px rgba(0,0,0,.7)}
  50%{box-shadow:0 0 0 4px var(--accent-soft), 0 10px 22px -14px rgba(0,0,0,.7)}
}

.left{display:flex;align-items:center;gap:11px;min-width:0}

.preset{
  flex:none;
  font-size:11px;
  font-weight:700;
  color:var(--muted-text);
  background:rgba(127,127,127,0.12);
  border:1px solid var(--line);
  border-radius:5px;
  min-width:24px;
  text-align:center;
  padding:2px 3px;
  font-variant-numeric:tabular-nums;
  letter-spacing:.5px;
}
.station.playing .preset{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}

.station img{
  width:42px;height:42px;
  border-radius:7px;
  object-fit:cover;
  background:rgba(127,127,127,0.15);
  flex:none;
}
.name{font-weight:600;font-size:14.5px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.play-btn{
  background:transparent;
  border:1.5px solid var(--line);
  width:38px;height:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  color:var(--text);
  flex:none;
  transition:transform .1s ease, background-color .18s ease, border-color .18s ease, color .18s ease;
}
.play-btn svg{width:15px;height:15px}
.play-btn:hover{border-color:var(--accent)}
.play-btn:active{transform:scale(.92)}
.station.playing .play-btn{background:var(--accent);border-color:var(--accent);color:#1a1204}

@media(max-width:900px){
  .cols{flex-direction:column;margin-bottom:245px;padding:14px}
  .tagline{display:none}
}
@media(max-width:640px){
  .cols{margin-bottom:300px}
}
@media(max-width:520px){
  .name{max-width:150px}
}

/* ===== PLAYER ===== */
.player-box{
  position:fixed;
  bottom:0;left:0;right:0;
  padding:14px 18px;
  background:var(--header);
  border-top:1px solid var(--line);
  box-shadow:0 0 0 1px var(--line) inset, 0 -18px 40px -20px rgba(0,0,0,.7);
  z-index:2000;
}
.player-box::before{
  content:"";
  position:absolute;
  top:-1px;left:0;right:0;height:2px;
  background:linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity:.9;
}

.player-inner{
  max-width:1100px;
  margin:0 auto;
  display:flex;
  align-items:center;
  gap:18px;
}

/* Big transport knob */
.transport-btn{
  flex:none;
  width:52px;height:52px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  background:radial-gradient(circle at 32% 28%, #33363f, #1c1e26 70%);
  box-shadow:0 3px 0 rgba(0,0,0,.4), 0 6px 14px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:center;
  color:var(--muted-text);
  transition:transform .12s ease, color .2s ease, box-shadow .2s ease;
}
.transport-btn svg{width:18px;height:18px}
.transport-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.4), 0 3px 8px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.06)}
.transport-btn.is-playing{
  color:#1a1204;
  background:radial-gradient(circle at 32% 28%, var(--accent), var(--accent-dark) 75%);
  box-shadow:0 3px 0 var(--accent-darker), 0 6px 18px var(--accent-soft), inset 0 0 0 1px rgba(255,255,255,.15);
}

.now-wrap{flex:none;display:flex;flex-direction:column;gap:3px;max-width:180px;min-width:0}
.now-row{display:flex;align-items:center;gap:7px;min-width:0}
.on-air-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--muted-text);
  flex:none;
}
.now-wrap.playing .on-air-dot{
  background:var(--danger);
  box-shadow:0 0 8px var(--danger);
  animation:blink 1.4s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.player-title{
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-weight:700;font-size:14px;
}
.player-status{font-size:11.5px;color:var(--muted-text)}

.eq-wrap{
  flex:1;
  min-width:0;
  height:56px;
  border-radius:8px;
  overflow:hidden;
  background:var(--bg-grain);
  box-shadow:inset 0 0 0 1px var(--line);
}
#eq{width:100%;height:100%;display:block}

.volume-wrap{flex:none;display:flex;align-items:center;gap:9px;width:170px}
.mute-btn{
  flex:none;
  width:34px;height:34px;
  border-radius:50%;
  border:1px solid var(--line);
  background:transparent;
  color:var(--text);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .18s ease;
}
.mute-btn svg{width:16px;height:16px}
.mute-btn:hover{border-color:var(--accent)}

input[type="range"]#volume{
  -webkit-appearance:none;appearance:none;
  direction:ltr; /* keeps native thumb travel (min→max, left→right) in sync with our left-anchored fill, regardless of page RTL */
  flex:1;
  height:4px;
  border-radius:3px;
  background:linear-gradient(90deg, var(--accent) var(--vol,100%), var(--line) var(--vol,100%));
  cursor:pointer;
}
input[type="range"]#volume::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:15px;height:15px;border-radius:50%;
  background:linear-gradient(180deg,#fff,#d8d8d8);
  box-shadow:0 1px 3px rgba(0,0,0,.5);
  cursor:pointer;
  margin-top:0;
}
input[type="range"]#volume::-moz-range-thumb{
  width:15px;height:15px;border-radius:50%;border:none;
  background:linear-gradient(180deg,#fff,#d8d8d8);
  box-shadow:0 1px 3px rgba(0,0,0,.5);
  cursor:pointer;
}
input[type="range"]#volume::-moz-range-track{height:4px;border-radius:3px;background:var(--line)}

@media(max-width:760px){
  .player-inner{gap:12px}
  .now-wrap{max-width:150px}
  .volume-wrap{width:130px}
}

/* Portrait phones: everything in one row no longer fits, so the
   "now playing" status wraps onto its own full-width line above the
   transport button / equalizer / volume row, instead of being hidden. */
@media(max-width:640px){
  .player-inner{flex-wrap:wrap; row-gap:10px}
  .now-wrap{order:-1; flex:1 1 100%; max-width:none; min-width:100%}
  .volume-wrap{width:120px}
}

</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 40 40">
        <rect x="2" y="15" width="36" height="22" rx="5" fill="none" stroke="var(--accent)" stroke-width="2"/>
        <circle cx="12" cy="26" r="5.5" fill="none" stroke="var(--accent)" stroke-width="2"/>
        <circle cx="12" cy="26" r="1.4" fill="var(--accent)"/>
        <rect x="23" y="20" width="2.6" height="10" rx="1.3" fill="var(--accent)"/>
        <rect x="28" y="17" width="2.6" height="13" rx="1.3" fill="var(--accent)"/>
        <rect x="33" y="22" width="2.6" height="8" rx="1.3" fill="var(--accent)"/>
        <g class="needle">
          <line x1="16" y1="6" x2="16" y2="15" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="16" cy="6" r="2.4" fill="var(--accent)"/>
        </g>
      </svg>
    </div>
    <div class="brand-text">
      <div class="title">رادیو آنلاین</div>
      <div class="tagline">پخش زنده ایستگاه‌های فارسی، ترکی و آذری</div>
    </div>
  </div>

  <div class="topbar-controls">
    <button id="installBtn" class="install-btn" hidden>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"></path></svg>
      <span>نصب اپلیکیشن</span>
    </button>

    <div id="themeSwitch" class="switch" title="تغییر حالت" role="switch" aria-checked="true">
      <div class="switch-icon">🌙</div>
      <div class="switch-circle"></div>
    </div>

    <div class="color-picker" id="colorPicker" title="تغییر رنگ تم">
      <div class="color-swatch selected" data-color="#f2a33d" style="background:#f2a33d;color:#f2a33d"></div>
      <div class="color-swatch" data-color="#00aaff" style="background:#00aaff;color:#00aaff"></div>
      <div class="color-swatch" data-color="#5be38a" style="background:#5be38a;color:#5be38a"></div>
      <div class="color-swatch" data-color="#ff5577" style="background:#ff5577;color:#ff5577"></div>
      <div class="color-swatch" data-color="#c95bff" style="background:#c95bff;color:#c95bff"></div>
    </div>
  </div>
</div>

<!-- CHANNEL LIST -->
<div class="cols">
  <div class="col">
    <div class="category">📌 ترکی و آذری <span class="count" id="count_tr"></span></div>
    <div class="station-list" id="cat_tr"></div>
  </div>

  <div class="col">
    <div class="category">📌 فارسی <span class="count" id="count_fa"></span></div>
    <div class="station-list" id="cat_fa"></div>
  </div>
</div>

<!-- PLAYER -->
<div class="player-box">
  <div class="player-inner">
    <button class="transport-btn" id="stopBtn" title="توقف" aria-label="توقف پخش">
      <svg id="transportIcon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
    </button>

    <div class="now-wrap" id="nowWrap">
      <div class="now-row">
        <span class="on-air-dot" aria-hidden="true"></span>
        <div class="player-title" id="nowPlaying">هیچ رادیویی انتخاب نشده</div>
      </div>
      <div class="player-status" id="nowStatus">آماده پخش</div>
    </div>

    <div class="eq-wrap"><canvas id="eq" aria-hidden="true"></canvas></div>

    <div class="volume-wrap">
      <input id="volume" type="range" min="0" max="1" value="1" step="0.01" aria-label="حجم صدا">
      <button class="mute-btn" id="muteBtn" title="بی‌صدا" aria-label="قطع/وصل صدا">
        <svg id="muteIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 5V4L8 9H4z"></path></svg>
      </button>
    </div>
  </div>
</div>

/* =========================
   Icons (inline SVG strings)
   ========================= */
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"></path></svg>';
const ICON_STOP = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>';

/* =========================
   UI / List rendering
   ========================= */
function createList(list, target){
  target.innerHTML = "";
  list.forEach((ch, idx)=>{
    const id = "btn_" + ch.name.replace(/\s+/g,"_").replace(/[^\w\-]/g,"");
    const preset = String(idx+1).padStart(2,"0");
    const el = document.createElement("div");
    el.className="station";
    el.dataset.id = id;

    el.innerHTML = `
      <div class="left">
        <div class="preset">${preset}</div>
        <img src="${ch.logo}" referrerpolicy="no-referrer" loading="lazy" alt="${ch.name} logo">
        <div class="name">${ch.name}</div>
      </div>
      <button class="play-btn" id="${id}" aria-label="پخش ${ch.name}">${ICON_PLAY}</button>
    `;

    el.querySelector("button").onclick = ()=> toggleChannel(ch);
    el.querySelector(".left").onclick = ()=> toggleChannel(ch);
    target.appendChild(el);
  });
}

/* ==================================== */
/*          AUDIO + EQ ENGINE           */
/* ==================================== */

let audio = new Audio();
audio.crossOrigin = "anonymous";

let audioCtx = null;
let analyser = null;
let sourceNode = null;
let dataArray = null;
let userGesture = false;

function ensureAudioContext(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 128;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    sourceNode = audioCtx.createMediaElementSource(audio);
    sourceNode.connect(analyser);
    analyser.connect(audioCtx.destination);
  }
}

/* Fix Chrome autoplay restriction */
document.addEventListener("click", ()=>{
  userGesture = true;
  ensureAudioContext();
  if(audioCtx && audioCtx.state === "suspended"){
    audioCtx.resume();
  }
}, {once:true});


/* ==================================== */
/*        PLAYER CONTROL LOGIC          */
/* ==================================== */

let currentChannel = null;

const nowPlayingEl = document.getElementById("nowPlaying");
const nowStatusEl = document.getElementById("nowStatus");
const nowWrapEl = document.getElementById("nowWrap");
const transportBtn = document.getElementById("stopBtn");
const transportIconWrap = document.getElementById("transportIcon").parentElement;

function updateButtons(isPlaying){
  document.querySelectorAll(".station").forEach(st=>{
    st.classList.remove("playing");
    const btn = st.querySelector(".play-btn");
    btn.innerHTML = ICON_PLAY;
    btn.setAttribute("aria-label","پخش " + st.querySelector(".name").textContent);
  });

  if(currentChannel){
    const id = "btn_" + currentChannel.name.replace(/\s+/g,"_").replace(/[^\w\-]/g,"");
    const btn = document.getElementById(id);
    const card = btn ? btn.closest(".station") : null;
    if(card){
      card.classList.add("playing");
      btn.innerHTML = ICON_STOP;
      btn.setAttribute("aria-label","توقف " + currentChannel.name);
    }
  }

  transportBtn.classList.toggle("is-playing", !!isPlaying);
  transportIconWrap.innerHTML = isPlaying ? ICON_STOP : ICON_PLAY;
}

/* Status text is driven separately from real <audio> events (not from the
   click itself), since connecting to a stream usually takes a second or
   two — the on-air dot only blinks once sound is actually flowing. */
function setStatus(text, isLive){
  nowStatusEl.textContent = text;
  nowWrapEl.classList.toggle("playing", !!isLive);
}

audio.addEventListener("playing", ()=>{
  if(currentChannel) setStatus("در حال پخش", true);
});
audio.addEventListener("waiting", ()=>{
  if(currentChannel) setStatus("در حال اتصال به رادیو…", false);
});
audio.addEventListener("error", ()=>{
  if(currentChannel) setStatus("خطا در اتصال، دوباره امتحان کنید", false);
});

/* ============ M3U8 + toggleChannel ============ */

function toggleChannel(ch){
  if(!userGesture) ensureAudioContext();

  // اگر همان کانال در حال پخش است -> متوقفش کن
  if(currentChannel && currentChannel.url === ch.url && !audio.paused){
    audio.pause();
    audio.src = "";
    currentChannel = null;
    if(window.hls){ window.hls.destroy(); window.hls = null; }
    nowPlayingEl.textContent = "هیچ رادیویی انتخاب نشده";
    updateButtons(false);
    setStatus("آماده پخش", false);
    return;
  }

  currentChannel = ch;

  // اگر لینک m3u8 است و hls.js پشتیبانی می‌شود
  try {
    const isM3U8 = typeof ch.url === "string" && ch.url.toLowerCase().includes(".m3u8");
    if (window.Hls && Hls.isSupported() && isM3U8) {
      if(window.hls){ window.hls.destroy(); window.hls = null; }
      window.hls = new Hls();
      window.hls.loadSource(ch.url);
      window.hls.attachMedia(audio);
      window.hls.on(Hls.Events.MANIFEST_PARSED, ()=> {
        // resume audio context if needed
        if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        audio.play().catch(e=>console.log("play error hls:", e));
      });
    } else {
      // fallback: مستقیم به audio.src
      if(window.hls){ window.hls.destroy(); window.hls = null; }
      audio.src = ch.url;
      if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      audio.play().catch(e=>console.log("play error src:", e));
    }
  } catch(err){
    console.log("toggleChannel error:", err);
    // fallback safe
    try{ audio.src = ch.url; audio.play().catch(()=>{}); }catch(e){}
  }

  nowPlayingEl.textContent = ch.name;
  updateButtons(true);
  setStatus("در حال اتصال به رادیو…", false);
}

/* Stop button (also acts as the main transport control) */
transportBtn.onclick = ()=>{
  audio.pause();
  audio.src = "";
  currentChannel = null;
  if(window.hls){ window.hls.destroy(); window.hls = null; }
  nowPlayingEl.textContent = "هیچ رادیویی انتخاب نشده";
  updateButtons(false);
  setStatus("آماده پخش", false);
};

const muteIconWrap = document.getElementById("muteIcon").parentElement;
const ICON_VOL_FULL = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 5V4L8 9H4zm11.5 3a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 15.5 12z"></path></svg>';
const ICON_VOL_MUTE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 5V4L8 9H4zm14.59 3 2.7-2.71-1.41-1.41L17.18 10.6l-2.7-2.71-1.41 1.41L15.77 12l-2.7 2.71 1.41 1.41 2.7-2.71 2.71 2.71 1.41-1.41z"></path></svg>';

let lastVolume = 1;

function setVolumeUI(v){
  volumeInput.style.setProperty("--vol", (v*100) + "%");
  muteIconWrap.innerHTML = v <= 0 ? ICON_VOL_MUTE : ICON_VOL_FULL;
}

volumeInput.oninput = e=>{
  const v = parseFloat(e.target.value);
  audio.volume = v;
  if(v > 0) lastVolume = v;
  setVolumeUI(v);
};

  if(audio.volume > 0){
    lastVolume = audio.volume;
    audio.volume = 0;
    volumeInput.value = 0;
  } else {
    audio.volume = lastVolume || 1;
    volumeInput.value = audio.volume;
  }
  setVolumeUI(audio.volume);
};

/* ==================================== */
/*            EQUALIZER DRAW            */
/* ==================================== */

const canvas = document.getElementById("eq");
const ctx = canvas.getContext("2d");
const eqWrap = document.querySelector(".eq-wrap");

function resizeEQ(){
  const rect = eqWrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resizeEQ();
window.addEventListener("resize", resizeEQ);

function roundedBar(x, yTop, w, h, r){
  const rr = Math.min(r, w/2, h);
  ctx.beginPath();
  if(ctx.roundRect){
    ctx.roundRect(x, yTop, w, h, [rr, rr, 0, 0]);
  } else {
    ctx.rect(x, yTop, w, h);
  }
  ctx.fill();
}

let idleT = 0;

/* Mixes a hex color toward white so the equalizer's peak highlight always
   stays in the same hue family as whichever accent color is selected,
   instead of a fixed red that can clash with cooler accents. */
function lightenHex(hex, amt){
  hex = hex.replace("#","");
  if(hex.length === 3) hex = hex.split("").map(c=>c+c).join("");
  const num = parseInt(hex, 16);
  let r = (num>>16)&255, g=(num>>8)&255, b=num&255;
  r = Math.round(r + (255-r)*amt);
  g = Math.round(g + (255-g)*amt);
  b = Math.round(b + (255-b)*amt);
  return "#" + [r,g,b].map(x=>x.toString(16).padStart(2,"0")).join("");
}

function drawEQ(){
  requestAnimationFrame(drawEQ);
  const w = eqWrap.clientWidth, h = eqWrap.clientHeight;
  if(!w || !h) return;

  ctx.clearRect(0,0,w,h);

  const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#f2a33d";
  const peakColor = lightenHex(accent, 0.55);
  const isPlaying = analyser && currentChannel && !audio.paused;

  if(isPlaying){
    analyser.getByteFrequencyData(dataArray);
    const barCount = dataArray.length;
    const gap = 2;
    const barWidth = (w - gap*(barCount-1)) / barCount;

    for(let i=0;i<barCount;i++){
      const v = dataArray[i] / 255;
      const barHeight = Math.max(2, v * h * 0.92);
      const grad = ctx.createLinearGradient(0, h-barHeight, 0, h);
      grad.addColorStop(0, v > 0.85 ? peakColor : accent);
      grad.addColorStop(1, accent + "55");
      ctx.fillStyle = grad;
      roundedBar(i*(barWidth+gap), h-barHeight, barWidth, barHeight, 2);
    }
  } else {
    // idle "waiting for signal" ambient sweep
    idleT += 0.02;
    ctx.strokeStyle = accent + "40";
    ctx.lineWidth = 2;
    ctx.beginPath();
    const steps = 64;
    for(let i=0;i<=steps;i++){
      const x = (i/steps) * w;
      const y = h/2 + Math.sin(i*0.35 + idleT*3) * (h*0.14) * Math.sin(idleT + i*0.05);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
}
drawEQ();

/* Accent color picker */

/* Derives the soft glow / darker shades used around the app (toggle knob,
   transport button, on-air glow) from whichever accent color is chosen,
   so nothing is left with a leftover amber tint when the color changes. */
function hexToRgbParts(hex){
  hex = hex.replace("#","");
  if(hex.length === 3) hex = hex.split("").map(c=>c+c).join("");
  const num = parseInt(hex, 16);
  return [(num>>16)&255, (num>>8)&255, num&255];
}
function darkenHex(hex, amt){
  const [r,g,b] = hexToRgbParts(hex).map(c => Math.round(c*(1-amt)));
  return "#" + [r,g,b].map(x=>x.toString(16).padStart(2,"0")).join("");
}
function applyAccent(hex){
  const [r,g,b] = hexToRgbParts(hex);
  const root = document.documentElement;
  root.style.setProperty("--accent", hex);
  root.style.setProperty("--accent-soft", `rgba(${r},${g},${b},0.16)`);
  root.style.setProperty("--accent-dark", darkenHex(hex, 0.24));
  root.style.setProperty("--accent-darker", darkenHex(hex, 0.5));
}

  sw.onclick = ()=>{
    document.querySelectorAll(".color-swatch").forEach(s=>s.classList.remove("selected"));
    sw.classList.add("selected");
    applyAccent(sw.dataset.color);
  };
});

/* ==================================== */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(err=>console.log("SW registration failed:", err));
  });

/* Android/Chrome don't always show their own install banner right away —
   this gives a direct, always-visible way to trigger it once the browser
   confirms the site meets the installability criteria. iOS Safari never
   fires this event; iOS users still install manually via Share → "Add to
   Home Screen", which is unavoidable (Apple doesn't expose this API). */
let deferredInstallPrompt = null;
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  installBtn.hidden = false;
});

installBtn.onclick = async ()=>{
  if(!deferredInstallPrompt) return;
  installBtn.hidden = true;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
};

window.addEventListener("appinstalled", ()=>{
  installBtn.hidden = true;
  deferredInstallPrompt = null;
});
